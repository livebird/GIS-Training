<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 5 — Glossary</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <div class="page-head fade-up">
    <div class="eyebrow">Chapter 5</div>
    <h1>Glossary</h1>
    <p class="lead">Terms as used in this chapter, in plain words. Tags: <span class="pill">Esri</span> <span class="pill">QGIS</span> <span class="pill">format</span> — untagged terms are general ideas.</p>
  </div>
  <input class="gloss-search" id="q" type="search" placeholder="Type to filter… e.g. datum, EPSG, longitude, geoid" aria-label="Filter glossary">
  <dl class="gloss" id="gloss"></dl>
  <p style="margin-top:2rem"><a class="btn ghost" href="index.html">← Chapter home</a></p>
</main>
<script src="assets/app.js"></script>
<script>
function pageInit() {
  const E = ' <span class="pill">Esri</span>', Q = ' <span class="pill">QGIS</span>', F = ' <span class="pill">format</span>';
  const terms = [
    ["Area of use (extent)", "The region a CRS definition is valid for, written in its register entry. Outside it the numbers may still be computable but are not trustworthy."],
    ["Axis", "One direction of measurement in a CRS: latitude, longitude, easting, northing, x, y, height."],
    ["Axis order", "The sequence in which a file, API or function writes the coordinate values. A contract of the container — different from the CRS’s formal axis list."],
    ["Coordinate", "An ordered set of numbers giving a position in a reference system."],
    ["Coordinate card", "This course’s five-line description of a coordinate: values, CRS, units, container order, precision."],
    ["Coordinate reference system (CRS)", "The written agreement that gives coordinate numbers meaning: origin, axes, units and Earth model. Esri’s software also says “coordinate system” or “spatial reference”."],
    ["CRS84" + F, "The OGC identifier for longitude–latitude on WGS 84; the CRS that RFC 7946 GeoJSON always uses."],
    ["Data CRS (layer CRS)", "The CRS the stored coordinates of a dataset are actually in. Read it from the layer’s properties, not from the map."],
    ["Datum (geodetic datum, reference frame)", "The part of a CRS that says where the ellipsoid sits relative to the Earth and how it is turned. Change the datum and the same spot gets different numbers."],
    ["Datum ensemble", "A family of very close versions of a datum treated as one for everyday accuracy — the EPSG register describes WGS 84 this way."],
    ["Decimal degrees (DD)", "An angle written as one signed decimal number, e.g. 23.0250."],
    ["Degrees–minutes–seconds (DMS)", "An angle written like a clock: 60 minutes in a degree, 60 seconds in a minute, e.g. 23° 01′ 30″ N."],
    ["Display units" + E, "The units the coordinate read-out at the bottom of an ArcGIS Pro map view uses. Changing them changes only what is printed, not the map’s CRS."],
    ["Easting, northing", "The x and y of most projected CRSs, in metres or feet, measured east and north from an origin — often with a “false” offset added so numbers stay positive."],
    ["Ellipsoid (spheroid)", "A smooth mathematical model of the Earth’s shape: a ball squashed along one axis, described by two radii and a flattening. Esri says “spheroid”."],
    ["Ellipsoidal height", "Height measured from the ellipsoid. What a GPS receiver natively gives, and what GeoJSON’s third number means."],
    ["EPSG code", "A number that looks up one CRS (or related object) in the public EPSG Geodetic Parameter Dataset — like a PIN code for a CRS. ArcGIS calls it a WKID."],
    ["Equator", "The circle midway between the poles; the line of zero latitude."],
    ["Geographic CRS", "A CRS that stores angles (latitude, longitude) on an ellipsoid. Units are degrees."],
    ["Geoid", "A surface that follows gravity and approximates mean sea level; the reference for “height above sea level”."],
    ["GeoJSON" + F, "A JSON format for geographic data (RFC 7946). Positions are [longitude, latitude] in decimal degrees on WGS 84 — always."],
    ["Graticule", "The net of parallels and meridians drawn on a globe or map."],
    ["Gravity-related height", "Height measured from the geoid — “height above sea level”."],
    ["Hemisphere", "Half of the Earth: north/south of the equator, or east/west of the prime meridian."],
    ["Latitude", "The angle north (+) or south (−) of the equator: −90 to +90."],
    ["Longitude", "The angle east (+) or west (−) of the prime meridian: −180 to +180."],
    ["Map CRS (project / display CRS)", "The CRS a map view draws all layers in. Layers in other CRSs are converted for display only."],
    ["Map projection", "The mathematical rule that flattens angles on the ellipsoid into coordinates on a sheet. Every projection distorts something."],
    ["Map units" + E, "In ArcGIS Pro, the units of the map’s coordinate system; read-only, changed only by changing the map CRS."],
    ["Meridian", "A line of equal longitude, running pole to pole."],
    ["On-the-fly projection", "Converting layers to the map CRS for display only, without changing the stored data. Both ArcGIS Pro and QGIS do this by default."],
    ["Parallel", "A line of equal latitude, running east–west."],
    ["Prime meridian", "The line of zero longitude; for most CRSs, the one through Greenwich, London."],
    ["Projected CRS", "A CRS that stores flat coordinates in metres or feet. It contains a geographic CRS plus a projection and its parameters."],
    ["Provenance", "Where data came from: who created it, when, with what, and in which CRS they say."],
    ["Spatial reference" + E, "Esri’s term for the coordinate system plus tolerance and resolution settings of a dataset."],
    ["Unknown CRS" + E + Q, "A dataset or map with no coordinate system defined. ArcGIS Pro then treats values as unitless and blocks editing; QGIS treats them as “purely numerical, non-earth values”."],
    ["UTM", "Universal Transverse Mercator: a family of 60 zones, each 6° of longitude wide, each with a north and a south version, using easting/northing in metres. India spans zones 42–47."],
    ["Vertical CRS / vertical datum", "The definition of the surface, unit and direction from which heights or depths are measured."],
    ["Web Mercator", "EPSG:3857, “WGS 84 / Pseudo-Mercator”: the sphere-based projected CRS in metres that web maps draw in. Distances and areas are distorted, more so away from the equator."],
    ["WGS 84", "World Geodetic System 1984: a datum (ensemble) and ellipsoid. The base of EPSG:4326, 3857, 4979 and the “WGS 84 /” UTM zones — so “WGS 84” alone does not name one CRS."],
    ["WKID" + E, "Well-known ID: Esri’s name for the numeric CRS code (usually the EPSG code). Web Mercator was 102100 before it became 3857."],
    ["XY Table To Point" + E, "An ArcGIS Pro tool that makes points from a table’s x and y columns; you choose the coordinate system of the output. It treats 0 as a valid coordinate."]
  ];
  const dl = document.getElementById("gloss");
  const render = f => { dl.innerHTML = terms.filter(t => !f || t[0].toLowerCase().includes(f) || t[1].toLowerCase().includes(f)).map(t => `<dt>${t[0]}</dt><dd>${t[1]}</dd>`).join("") || "<dd>No matching term.</dd>"; };
  document.getElementById("q").addEventListener("input", e => render(e.target.value.trim().toLowerCase())); render("");
}
</script>
</body>
</html>
